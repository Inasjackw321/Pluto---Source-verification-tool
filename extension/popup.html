<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mediacheck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      background: #fafafa;
      color: #111;
      font-size: 13px;
    }

    /* Header */
    header {
      background: #111;
      color: #fff;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 28px; height: 28px;
      background: #fff;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: #111;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 700; }
    header p  { font-size: 10.5px; color: #888; margin-top: 1px; }

    /* Category legend */
    .legend {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      flex-wrap: wrap;
    }
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 600;
      border: 1.5px solid currentColor;
    }
    .legend-chip.state  { color: #b84c00; background: #fff0e0; }
    .legend-chip.misinfo { color: #b71c1c; background: #fce8e8; }
    .legend-chip.satire { color: #1a6bb5; background: #e8f0fe; }

    /* Add account */
    .section { padding: 10px 14px; border-bottom: 1px solid #e8e8e8; background: #fff; }
    .section-title {
      font-size: 10px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px;
    }
    .add-row { display: flex; gap: 5px; }
    .add-row input {
      flex: 1; border: 1.5px solid #ddd; border-radius: 8px;
      padding: 6px 9px; font-size: 12.5px; outline: none;
      font-family: inherit; background: #f5f5f5;
      transition: border-color 0.15s;
    }
    .add-row input:focus { border-color: #555; background: #fff; }
    .add-row input::placeholder { color: #aaa; }
    .add-row select {
      border: 1.5px solid #ddd; border-radius: 8px;
      padding: 6px 4px; font-size: 11.5px; background: #f5f5f5;
      font-family: inherit; outline: none;
    }
    .btn-add {
      background: #111; color: #fff; border: none;
      border-radius: 8px; padding: 6px 13px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-add:hover { background: #333; }
    #addError { font-size: 11px; color: #b71c1c; margin-top: 5px; min-height: 14px; }

    /* Account list */
    .section.list { padding: 0; max-height: 280px; overflow-y: auto; }

    .list-header {
      position: sticky; top: 0; z-index: 1;
      background: #fafafa;
      padding: 8px 14px 6px;
      font-size: 10px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .6px;
      border-bottom: 1px solid #e8e8e8;
    }

    .acc-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.1s;
    }
    .acc-item:hover { background: #f7f7f7; }
    .acc-item:last-child { border-bottom: none; }
    .acc-item.disabled .acc-handle { color: #bbb; text-decoration: line-through; }

    .acc-handle {
      flex: 1; font-size: 12.5px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .acc-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 10px;
      font-weight: 700; white-space: nowrap; border: 1.5px solid currentColor;
    }
    .acc-badge.state  { color: #b84c00; background: #fff0e0; }
    .acc-badge.misinfo { color: #b71c1c; background: #fce8e8; }
    .acc-badge.satire { color: #1a6bb5; background: #e8f0fe; }

    .blocked-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #b71c1c; flex-shrink: 0; title: "Blocked";
    }

    .acc-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .btn-sm {
      background: #f0f0f0; border: none; border-radius: 6px;
      padding: 3px 8px; font-size: 10.5px; font-weight: 600;
      cursor: pointer; color: #444; font-family: inherit;
      transition: background 0.12s;
    }
    .btn-sm:hover { background: #e0e0e0; }
    .btn-sm.danger { color: #b71c1c; }
    .btn-sm.danger:hover { background: #fce8e8; }

    footer {
      padding: 9px 14px;
      font-size: 10.5px; color: #aaa; text-align: center;
      border-top: 1px solid #e8e8e8; background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-icon">M</div>
    <div>
      <h1>Mediacheck</h1>
      <p>War Summary · Media reliability warnings</p>
    </div>
  </header>

  <div class="legend">
    <span class="legend-chip state">⚑ State media</span>
    <span class="legend-chip misinfo">⚠ Unverified</span>
    <span class="legend-chip satire">✎ Satire</span>
    <span style="font-size:10px;color:#888;align-self:center;margin-left:2px">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#b71c1c;margin-right:3px;vertical-align:middle"></span>= content hidden
    </span>
  </div>

  <div class="section">
    <div class="section-title">Add account</div>
    <div class="add-row">
      <input id="handleInput" type="text" placeholder="@username" autocomplete="off" spellcheck="false" />
      <select id="catSelect">
        <option value="state-affiliated">State media</option>
        <option value="misinformation">Unverified</option>
        <option value="satire">Satire</option>
      </select>
      <button class="btn-add" id="addBtn">Add</button>
    </div>
    <div id="addError"></div>
  </div>

  <div class="section list">
    <div class="list-header">Flagged accounts</div>
    <div id="accountList"></div>
  </div>

  <footer>Hover any badge on Twitter/X to see details.</footer>

  <script src="accounts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
